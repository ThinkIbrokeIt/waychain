# WayChain community site — self-hosted (replaces Vercel stopgap)
# Serves site/ from our own hardware. Flip = point waychain.org / a vhost at
# this server block. Staging: served at :8088 so we can verify before DNS cut.
#
# Deploy with ops/deploy-site.sh (clone/pull site/ -> /var/www/waychain,
# symlink this conf into sites-enabled, nginx -t && reload).
server {
    listen 8088;                       # staging port (verify before flip)
    # listen 443 ssl;                  # production: enable when cert + DNS cut
    # ssl_certificate     /etc/letsencrypt/live/waychain.org/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/waychain.org/privkey.pem;
    server_name waychain.org www.waychain.org;

    root /var/www/waychain;
    index index.html;

    # Vendor libs + assets served locally (no CDN). Long cache OK — hashed paths.
    location /vendor/ {
        alias /var/www/waychain/vendor/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location /js/ {
        alias /var/www/waychain/js/;
        add_header Cache-Control "public, max-age=3600" always;
    }
    location /fonts/ {
        alias /var/www/waychain/fonts/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # SPA-ish: unknown paths fall back to nearest html (wallet/dex/etc are files)
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
    }

    # Proxy /api + RPC through to the node (same box) so one host = full stack
    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Accept" always;
    }
    location /rpc {
        proxy_pass http://127.0.0.1:9545;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Access-Control-Allow-Origin "*" always;
    }
}
