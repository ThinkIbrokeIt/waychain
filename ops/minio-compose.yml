# Community Object Storage — MinIO (Step 5, DECENTRALIZATION-DOCTRINE.md)
# Members host their frontends/backends here instead of Vercel/aws. Rent in
# WAY pays for the space (survival, not profit).
#
# Flip = run this compose on community hardware + point member apps at it.
version: "3.8"
services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASS}
    volumes:
      - ./minio-data:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # console
    restart: unless-stopped
  nginx-minio:
    image: nginx:1.24
    volumes:
      - ./nginx-minio.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "9080:80"
    depends_on: [minio]
    restart: unless-stopped

# Rent model: each member bucket has a WAY balance. A cron (see RENT-LEDGER.md)
# debits rent = f(bytes_stored, bandwidth) from the member's WAY, transferred
# to the foundation/steward address that pays the hardware. Surplus grows
# capacity, never a treasury. Public ledger on WayChain.
